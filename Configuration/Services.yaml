services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MoveElevator\Typo3ImageCompression\:
    resource: "../Classes/*"
    exclude:
      - "../Classes/Domain/Model/*"
      - "../Classes/Event/*"

  MoveElevator\Typo3ImageCompression\Compression\CompressorInterface:
    factory: ['@MoveElevator\Typo3ImageCompression\Compression\CompressorFactory', 'create']
    public: true

  MoveElevator\Typo3ImageCompression\Resource\FileResolver:
    alias: MoveElevator\Typo3ImageCompression\Resource\Typo3FileResolver

  cache.typo3_image_compression:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      - 'typo3_image_compression'

  MoveElevator\Typo3ImageCompression\Compression\TinifyCompressor:
    public: true
    arguments:
      $cache: '@cache.typo3_image_compression'

  # Backend route target, resolved by TYPO3\CMS\Core\Http\Dispatcher via the
  # PSR-11 container's has()/get(), which only recognizes public services;
  # a private service here silently falls back to a plain `new` with no
  # constructor arguments instead of failing loudly.
  MoveElevator\Typo3ImageCompression\Controller\RestoreFileController:
    public: true

  # Event Listeners
  # Note: When TYPO3 v12 support is dropped, these can be replaced with #[AsEventListener] attributes
  MoveElevator\Typo3ImageCompression\EventListener\AfterFileAdded:
    tags:
      - name: event.listener
        identifier: typo3-image-compression-after-file-added-event
        event: TYPO3\CMS\Core\Resource\Event\AfterFileAddedEvent

  MoveElevator\Typo3ImageCompression\EventListener\AfterFileReplaced:
    tags:
      - name: event.listener
        identifier: typo3-image-compression-after-file-replaced-event
        event: TYPO3\CMS\Core\Resource\Event\AfterFileReplacedEvent

  MoveElevator\Typo3ImageCompression\EventListener\AfterFileListRendered:
    tags:
      - name: event.listener
        identifier: typo3-image-compression-after-backend-page-renderer-event
        event: TYPO3\CMS\Filelist\Event\ProcessFileListActionsEvent

  MoveElevator\Typo3ImageCompression\EventListener\SystemInformationToolbar:
    tags:
      - name: event.listener
        identifier: typo3-image-compression-system-information-toolbar-event
        event: TYPO3\CMS\Backend\Backend\Event\SystemInformationToolbarCollectorEvent

  # Message Handlers
  # Note: When TYPO3 v12 support is dropped, this can be replaced with #[AsMessageHandler]
  MoveElevator\Typo3ImageCompression\MessageHandler\CompressImageMessageHandler:
    tags:
      - name: messenger.message_handler

  # Console Commands
  # Note: When TYPO3 v12 support is dropped, this can be replaced with #[AsCommand] attribute
  MoveElevator\Typo3ImageCompression\Command\CompressImageCommand:
    tags:
      - name: console.command
        command: imagecompression:compressImages
        description: Compress uncompressed images

  MoveElevator\Typo3ImageCompression\Command\RestoreImageCommand:
    tags:
      - name: console.command
        command: imagecompression:restore
        description: Restore original files from their backup

  MoveElevator\Typo3ImageCompression\Command\PruneBackupsCommand:
    tags:
      - name: console.command
        command: imagecompression:pruneBackups
        description: Delete backups older than the configured retention

  # Upgrade Wizards
  MoveElevator\Typo3ImageCompression\Updates\CompressionColumnsUpgradeWizard:
    public: true
    tags:
      - name: install.upgradewizard
        identifier: typo3ImageCompression_compressionColumns
